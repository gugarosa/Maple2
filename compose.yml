services:
  # One-shot database migration and metadata ingestion. This profile prevents
  # ingestion from running during a normal `docker compose up`.
  # Run with: docker compose --profile ingest run --build --rm file-ingest
  file-ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: ./Maple2.File.Ingest/Dockerfile
    container_name: maple2-file-ingest
    image: maple2/file-ingest
    working_dir: /app/Maple2.File.Ingest
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_IP: mysql
      DB_PORT: 3306
      MS2_DATA_FOLDER: /ClientData
    volumes:
      - .:/app
      - ${MS2_DOCKER_DATA_FOLDER}:/ClientData

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: maple2-db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: ./Maple2.Server.Web/Dockerfile
    container_name: maple2-web
    image: maple2/web
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4000}:${WEB_PORT:-4000}"
    env_file:
      - .env
    environment:
      DB_IP: mysql
      DB_PORT: 3306
      WEB_PORT: ${WEB_PORT:-4000}
    restart: unless-stopped

  world:
    build:
      context: .
      dockerfile: ./Maple2.Server.World/Dockerfile
    container_name: maple2-world
    image: maple2/world
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 21001:21001
    env_file:
      - .env
    environment:
      DB_IP: mysql
      DB_PORT: 3306
      GRPC_LOGIN_IP: login
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/21001' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  login:
    build:
      context: .
      dockerfile: ./Maple2.Server.Login/Dockerfile
    container_name: maple2-login
    image: maple2/login
    depends_on:
      mysql:
        condition: service_healthy
      world:
        condition: service_healthy
    ports:
      - 20001:20001
    env_file:
      - .env
    environment:
      DB_IP: mysql
      DB_PORT: 3306
      GRPC_WORLD_IP: world
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/21000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  game-ch0:
    build:
      context: .
      dockerfile: ./Maple2.Server.Game/Dockerfile
    image: maple2/game
    depends_on:
      mysql:
        condition: service_healthy
      world:
        condition: service_healthy
    ports:
      - 20002:20002
      - 21002:21002
    env_file:
      - .env
    environment:
      DB_IP: mysql
      DB_PORT: 3306
      INSTANCED_CONTENT: true
      GRPC_WORLD_IP: world
      GRPC_GAME_IP: game-ch0
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  game-ch1:
    build:
      context: .
      dockerfile: ./Maple2.Server.Game/Dockerfile
    image: maple2/game
    depends_on:
      mysql:
        condition: service_healthy
      world:
        condition: service_healthy
    ports:
      - 20003:20003
      - 21003:21003
    env_file:
      - .env
    environment:
      DB_IP: mysql
      DB_PORT: 3306
      GRPC_WORLD_IP: world
      GRPC_GAME_IP: game-ch1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  mysql:
