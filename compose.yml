x-database-environment: &database-environment
  DB_IP: mysql
  DB_PORT: 3306
  DB_USER: ${DB_USER:?Set DB_USER in .env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DATA_DB_NAME: ${DATA_DB_NAME:?Set DATA_DB_NAME in .env}
  GAME_DB_NAME: ${GAME_DB_NAME:?Set GAME_DB_NAME in .env}

x-config-volume: &config-volume
  type: bind
  source: ./config.yaml
  target: /app/config.yaml
  read_only: true
  bind:
    create_host_path: false

services:
  # Explicit migration/metadata job; never runs during normal startup.
  # Stop application services first, retaining MySQL and its player volume.
  # Run with: docker compose --profile ingest run --build --rm file-ingest
  file-ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: ./Maple2.File.Ingest/Dockerfile
    image: maple2/file-ingest
    working_dir: /app/Maple2.File.Ingest
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *database-environment
      LANGUAGE: ${LANGUAGE:?Set LANGUAGE in .env}
      MS2_DATA_FOLDER: /ClientData
      MS2_NAVMESH_DIR: /app/Navmeshes
    volumes:
      - navmeshes:/app/Navmeshes
      - type: bind
        source: ${MS2_DOCKER_DATA_FOLDER:?Set MS2_DOCKER_DATA_FOLDER to the client Data directory}
        target: /ClientData
        read_only: true
        bind:
          create_host_path: false

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    stop_grace_period: 1m
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - 127.0.0.1:3306:3306
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user=root --execute="SELECT 1" --silent --skip-column-names
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: ./Maple2.Server.Web/Dockerfile
    image: maple2/web
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-4000}:${WEB_PORT:-4000}"
    env_file:
      - .env
    environment:
      <<: *database-environment
      WEB_PORT: ${WEB_PORT:-4000}
      WEB_DATA_DIR: /app/Data
    volumes:
      - web-data:/app/Data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/$$WEB_PORT'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  world:
    build:
      context: .
      dockerfile: ./Maple2.Server.World/Dockerfile
    image: maple2/world
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 127.0.0.1:21001:21001
    env_file:
      - .env
    environment:
      <<: *database-environment
      GRPC_WORLD_PORT: 21001
      GRPC_LOGIN_IP: login
      CONFIG_PATH: /app/config.yaml
    volumes:
      - *config-volume
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/21001'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  login:
    build:
      context: .
      dockerfile: ./Maple2.Server.Login/Dockerfile
    image: maple2/login
    depends_on:
      mysql:
        condition: service_healthy
      world:
        condition: service_healthy
    ports:
      - "${CLIENT_BIND_IP:-127.0.0.1}:20001:20001"
    env_file:
      - .env
    environment:
      <<: *database-environment
      LOGIN_PORT: 20001
      GRPC_WORLD_IP: world
      GRPC_WORLD_PORT: 21001
      CONFIG_PATH: /app/config.yaml
    volumes:
      - *config-volume
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/20001'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  game-ch0:
    build:
      context: .
      dockerfile: ./Maple2.Server.Game/Dockerfile
    image: maple2/game
    depends_on:
      mysql:
        condition: service_healthy
      world:
        condition: service_healthy
    ports:
      - "${CLIENT_BIND_IP:-127.0.0.1}:20002:20002"
      - 127.0.0.1:21002:21002
    env_file:
      - .env
    environment:
      <<: *database-environment
      INSTANCED_CONTENT: "true"
      GRPC_WORLD_IP: world
      GRPC_WORLD_PORT: 21001
      GRPC_GAME_IP: game-ch0
      CONFIG_PATH: /app/config.yaml
      MS2_NAVMESH_DIR: /app/Navmeshes
    volumes:
      - *config-volume
      - navmeshes:/app/Navmeshes:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/21002;
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r status <&3; [[ "$$status" == "HTTP/1.1 200 "* ]]'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  game-ch1:
    build:
      context: .
      dockerfile: ./Maple2.Server.Game/Dockerfile
    image: maple2/game
    depends_on:
      mysql:
        condition: service_healthy
      world:
        condition: service_healthy
    ports:
      - "${CLIENT_BIND_IP:-127.0.0.1}:20003:20003"
      - 127.0.0.1:21003:21003
    env_file:
      - .env
    environment:
      <<: *database-environment
      INSTANCED_CONTENT: "false"
      GRPC_WORLD_IP: world
      GRPC_WORLD_PORT: 21001
      GRPC_GAME_IP: game-ch1
      CONFIG_PATH: /app/config.yaml
      MS2_NAVMESH_DIR: /app/Navmeshes
    volumes:
      - *config-volume
      - navmeshes:/app/Navmeshes:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/21003;
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r status <&3; [[ "$$status" == "HTTP/1.1 200 "* ]]'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  mysql:
  web-data:
  navmeshes:
