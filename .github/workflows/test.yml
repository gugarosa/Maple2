name: Test Maple2

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Test operations and client setup
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          .\scripts\test_operations.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\test_client_setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Azure foundation without deploying
        shell: pwsh
        run: |
          $template = Join-Path $env:RUNNER_TEMP 'maple2-foundation.json'
          az bicep build --file .\deploy\azure\foundation.bicep --outfile $template --only-show-errors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\test_azure_foundation.ps1 -CompiledTemplate $template
